<p class="forecast-meta" *ngIf="taf.validFrom || taf.validTo">
  Valid {{ zulu(taf.validFrom) }} &ndash; {{ zulu(taf.validTo) }}
  <span class="alt" *ngIf="taf.dateIssued">issued {{ zulu(taf.dateIssued) }}</span>
</p>

<p class="raw-taf" *ngIf="taf.text">{{ taf.text }}</p>

<ol class="periods" *ngIf="taf.periods.length > 0">
  <li *ngFor="let period of taf.periods">
    <app-forecast-period [period]="period"></app-forecast-period>
  </li>
</ol>

<p class="empty" *ngIf="taf.periods.length === 0">No forecast periods reported.</p>
